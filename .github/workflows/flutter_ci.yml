name: FlowCycle CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_build:
    name: Flutter Test & Release Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔍 Static Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Run Automated Test Suite (170 Tests across 34 Suites)
        run: flutter test --coverage

      - name: 🌐 Build Web Release Bundle
        run: flutter build web --release --no-wasm-dry-run

      - name: 📊 Verify Bundle Size
        run: |
          BUILD_SIZE=$(du -sh build/web | cut -f1)
          echo "Web build successfully compiled. Total size: $BUILD_SIZE"
